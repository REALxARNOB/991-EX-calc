<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <span id="mode">deg</span>
            <input type="text" id="result" readonly aria-label="Calculator Result">
        </div>
        <div class="buttons">
            <!-- Functions -->
            <button class="func" onclick="display('sqrt(')" title="Square Root" aria-label="Square Root">√</button>
            <button class="func" onclick="display('^')" title="Power" aria-label="Power">^</button>
            <button class="func" onclick="display('sin(')" title="Sine" aria-label="Sine">sin</button>
            <button class="func" onclick="display('cos(')" title="Cosine" aria-label="Cosine">cos</button>
            <button class="func" onclick="display('tan(')" title="Tangent" aria-label="Tangent">tan</button>

            <button class="func" onclick="display('log(')" title="Natural Logarithm" aria-label="Natural Logarithm">ln</button>
            <button class="func" onclick="display('log10(')" title="Base 10 Logarithm" aria-label="Base 10 Logarithm">log</button>
            <button class="func" onclick="display('(')" title="Open Parenthesis" aria-label="Open Parenthesis">(</button>
            <button class="func" onclick="display(')')" title="Close Parenthesis" aria-label="Close Parenthesis">)</button>
            <button class="func" onclick="toggleMode()" title="Toggle Degrees or Radians" aria-label="Toggle Degrees or Radians">Deg/Rad</button>

            <!-- Numbers and Basic Ops -->
            <button onclick="display('7')">7</button>
            <button onclick="display('8')">8</button>
            <button onclick="display('9')">9</button>
            <button class="op" onclick="backspace()" aria-label="Backspace" title="Backspace">&#9003;</button>
            <button class="op" onclick="clearScreen()" aria-label="Clear Display" title="Clear Display">C</button>

            <button onclick="display('4')">4</button>
            <button onclick="display('5')">5</button>
            <button onclick="display('6')">6</button>
            <button class="op" onclick="display('*')" title="Multiply" aria-label="Multiply">*</button>
            <button class="op" onclick="display('/')" title="Divide" aria-label="Divide">/</button>

            <button onclick="display('1')">1</button>
            <button onclick="display('2')">2</button>
            <button onclick="display('3')">3</button>
            <button class="op" onclick="display('+')" title="Add" aria-label="Add">+</button>
            <button class="op" onclick="display('-')" title="Subtract" aria-label="Subtract">-</button>

            <button onclick="display('0')" class="zero">0</button>
            <button onclick="display('.')">.</button>
            <button onclick="display('pi')" title="Pi" aria-label="Pi">π</button>
            <button class="equals" onclick="calculate()" title="Equals" aria-label="Equals">=</button>

            <!-- Memory and Hyperbolic -->
            <button class="mem" onclick="memoryClear()" title="Memory Clear" aria-label="Memory Clear">MC</button>
            <button class="mem" onclick="memoryAdd()" title="Memory Add" aria-label="Memory Add">M+</button>
            <button class="mem" onclick="memorySubtract()" title="Memory Subtract" aria-label="Memory Subtract">M-</button>
            <button class="mem" onclick="memoryRecall()" title="Memory Recall" aria-label="Memory Recall">MR</button>
            <button onclick="display('e')" title="Euler's Number" aria-label="Euler's Number">e</button>
            <button class="func" onclick="display('sinh(')" title="Hyperbolic Sine" aria-label="Hyperbolic Sine">sinh</button>
            <button class="func" onclick="display('cosh(')" title="Hyperbolic Cosine" aria-label="Hyperbolic Cosine">cosh</button>
            <button class="func" onclick="display('tanh(')" title="Hyperbolic Tangent" aria-label="Hyperbolic Tangent">tanh</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script>
    <script src="script.js"></script>
</body>
</html>
