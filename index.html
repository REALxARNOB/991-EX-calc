<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <span id="mode">deg</span>
            <input type="text" id="result" disabled aria-label="Calculator Result">
        </div>
        <div class="buttons">
            <!-- Functions -->
            <button class="func" onclick="display('sqrt(')" aria-label="Square root">√</button>
            <button class="func" onclick="display('^')" data-key="^" aria-label="Power">^</button>
            <button class="func" onclick="display('sin(')" aria-label="Sine">sin</button>
            <button class="func" onclick="display('cos(')" aria-label="Cosine">cos</button>
            <button class="func" onclick="display('tan(')" aria-label="Tangent">tan</button>

            <button class="func" onclick="display('log(')" aria-label="Natural Logarithm">ln</button>
            <button class="func" onclick="display('log10(')" aria-label="Logarithm">log</button>
            <button class="func" onclick="display('(')" data-key="(" aria-label="Left Parenthesis">(</button>
            <button class="func" onclick="display(')')" data-key=")" aria-label="Right Parenthesis">)</button>
            <button class="func" onclick="toggleMode()" aria-label="Toggle angle mode">Deg/Rad</button>

            <!-- Numbers and Basic Ops -->
            <button onclick="display('7')" data-key="7">7</button>
            <button onclick="display('8')" data-key="8">8</button>
            <button onclick="display('9')" data-key="9">9</button>
            <button class="op" onclick="backspace()" data-key="Backspace" aria-label="Backspace"><-</button>
            <button class="op" onclick="clearScreen()" data-key="Escape" aria-label="Clear">C</button>

            <button onclick="display('4')" data-key="4">4</button>
            <button onclick="display('5')" data-key="5">5</button>
            <button onclick="display('6')" data-key="6">6</button>
            <button class="op" onclick="display('*')" data-key="*" aria-label="Multiply">*</button>
            <button class="op" onclick="display('/')" data-key="/" aria-label="Divide">/</button>

            <button onclick="display('1')" data-key="1">1</button>
            <button onclick="display('2')" data-key="2">2</button>
            <button onclick="display('3')" data-key="3">3</button>
            <button class="op" onclick="display('+')" data-key="+" aria-label="Add">+</button>
            <button class="op" onclick="display('-')" data-key="-" aria-label="Subtract">-</button>

            <button onclick="display('0')" class="zero" data-key="0">0</button>
            <button onclick="display('.')" data-key="." aria-label="Decimal point">.</button>
            <button onclick="display('pi')" aria-label="Pi">π</button>
            <button class="equals" onclick="calculate()" data-key="=" aria-label="Calculate">=</button>

            <!-- Memory and Hyperbolic -->
            <button class="mem" onclick="memoryClear()" aria-label="Memory Clear">MC</button>
            <button class="mem" onclick="memoryAdd()" aria-label="Memory Add">M+</button>
            <button class="mem" onclick="memorySubtract()" aria-label="Memory Subtract">M-</button>
            <button class="mem" onclick="memoryRecall()" aria-label="Memory Recall">MR</button>
            <button onclick="display('e')" aria-label="Euler's number">e</button>
            <button class="func" onclick="display('sinh(')" aria-label="Hyperbolic Sine">sinh</button>
            <button class="func" onclick="display('cosh(')" aria-label="Hyperbolic Cosine">cosh</button>
            <button class="func" onclick="display('tanh(')" aria-label="Hyperbolic Tangent">tanh</button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script>
    <script src="script.js"></script>
</body>
</html>
